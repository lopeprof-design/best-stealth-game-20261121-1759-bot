<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>The Moonlit Archive — a stealth game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d0a08; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: Georgia, 'Times New Roman', serif; color: #e8ddc0; }
  h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: 2px; font-weight: normal; }
  h1 span { color: #ffe9a8; }
  canvas { width: min(960px, 96vw); height: auto; image-rendering: pixelated;
           border: 1px solid #3a2f22; box-shadow: 0 0 60px rgba(0,0,0,0.8); cursor: crosshair; }
  p { font-size: 13px; color: #9a8f78; margin: 8px 0 0; }
</style>
</head>
<body>
  <h1>THE <span>MOONLIT</span> ARCHIVE</h1>
  <canvas id="game"></canvas>
  <p>WASD move &middot; Shift sprint &middot; C crouch &middot; Click tosses a pebble &middot; Steal 3 star-charts, reach the exit unseen.</p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
